  #   name: tsugi-beat
  #   runtime: python
  #   buildCommand: pip install -r requirements.txt
  #   startCommand: celery -A worker.tasks beat --loglevel=info

  # Redis (FREE)
  - type: redis
    name: tsugi-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru