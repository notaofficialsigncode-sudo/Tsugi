services:
  # FastAPI web service (FREE)
  - type: web
    name: tsugi-api
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          name: tsugi-redis
          type: redis
          property: connectionString
      - key: FIREBASE_CREDENTIALS
        sync: false

  # Celery background worker (PAID - COMMENTED OUT)
