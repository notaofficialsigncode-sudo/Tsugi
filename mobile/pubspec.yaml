name: tsugi
description: manga & manhwa chapter tracker
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.3.0
  dio: ^5.7.0
  drift: ^2.22.0
  drift_flutter: ^0.2.4
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.1
  supabase_flutter: ^2.8.4
  firebase_core: ^3.9.0
  firebase_messaging: ^15.2.4
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.1
  collection: ^1.18.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.0
  drift_dev: ^2.22.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
